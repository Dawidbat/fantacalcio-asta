<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantacalcio Asta Live</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f7faff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}
.wrap{max-width:1400px;margin:auto;padding:18px}.glass{background:#0d1b2eeb;border:1px solid #263e5e;border-radius:20px;box-shadow:0 20px 70px #0007}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand{font-size:25px;font-weight:950}.muted{color:#8fa4bd}.row{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 15px;background:#2978ff;color:#fff;font-weight:850;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.alt{background:#21334c}.btn.green{background:#12a66a}.btn.red{background:#d94c64}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#172943;color:#cfe1fa;font-size:12px;font-weight:850}.login{max-width:480px;margin:8vh auto;padding:24px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #344d6d;background:#091525;color:#fff;outline:none}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) 360px;gap:15px}.card{padding:18px;margin-bottom:15px}.auction{text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center}.turn{font-weight:850;color:#8db8ff}.playername{font-size:40px;font-weight:1000;margin:8px}.timer{font-size:86px;line-height:1;font-weight:1000}.hot{color:#ff6375}.offer{font-size:24px;font-weight:950}.bidgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.bid{font-size:20px;padding:16px 5px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:170px}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;max-height:520px;overflow:auto}.player{padding:12px;background:#0a1728;border:1px solid #213956;border-radius:14px;cursor:pointer}.player:hover{border-color:#5c9dff}.player strong{display:block}.player small{color:#8299b2}.users{display:grid;gap:8px}.user{display:flex;justify-content:space-between;gap:8px;background:#0a1728;border-radius:12px;padding:11px}.me{outline:2px solid #2978ff}.team{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.mini{font-size:11px;background:#182a42;padding:4px 6px;border-radius:7px}.log{max-height:280px;overflow:auto}.log div{padding:8px 0;border-bottom:1px solid #1c3049;font-size:12px}.sale{font-size:13px;color:#92f2c8}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#d94c64;padding:13px 16px;border-radius:12px;display:none;z-index:20}
.roleblock{margin-top:9px}.rolehead{font-size:12px;font-weight:850;color:#cfe1fa}.teamfilters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.teamfilter{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:12px}.teamfilter.active{outline:2px solid #8db8ff}.teamicon{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#315276;color:#fff;font-size:9px;font-weight:950}
@media(max-width:900px){.layout{grid-template-columns:1fr}.timer{font-size:66px}.playername{font-size:30px}.wrap{padding:10px}.players{max-height:430px}}
</style></head><body><div class="wrap">
<section id="login" class="glass login"><div class="brand">⚽ Fantacalcio Asta Live</div><p class="muted">Crea una lega oppure entra con codice. Ogni partecipante usa il proprio nome.</p>
<input id="name" class="input" placeholder="Nome utente" maxlength="24"><div style="height:9px"></div><input id="code" class="input" placeholder="Codice lega (se entri)"><div style="height:9px"></div>
<input id="budget" class="input" type="number" min="1" value="500" placeholder="Budget iniziale"><div style="height:12px"></div><div class="row"><button id="createRoom" class="btn" type="button">Crea lega</button><button id="joinRoom" class="btn alt" type="button">Entra</button></div>
<p class="muted" style="font-size:12px;margin-top:14px">Una volta pubblicato online, puoi condividere lo stesso link con tutti.</p></section>
<section id="app" class="hidden"><div class="top"><div><div class="brand">⚽ Asta Live</div><span id="room" class="pill"></span></div><div class="row"><button id="copy" class="btn alt" onclick="copyLink()">🔗 Copia link</button><button id="start" class="btn green" onclick="start()">🚀 Inizia asta</button><button id="nextPhase" class="btn green hidden" type="button">➡️ Fase successiva</button><button class="btn alt" onclick="openDisplay()">📺 TV</button><button id="leaveRoom" class="btn red">Esci</button></div></div>
<div class="layout"><main>
<div class="glass card auction"><span id="phase" class="pill"></span><div id="turn" class="turn"></div><div id="pname" class="playername">Pronto</div><div id="timer" class="timer">15</div><div id="offer" class="offer">0 crediti</div><div id="bidder" class="muted">Nessuna offerta</div><div class="bidgrid"><button class="btn bid" onclick="bid(1)">+1</button><button class="btn bid" onclick="bid(2)">+2</button><button class="btn bid" onclick="bid(5)">+5</button><button class="btn bid" onclick="bid(10)">+10</button><button class="btn bid" onclick="bid(15)">+15</button></div></div>
<div class="glass card"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Giocatori disponibili</h2><span class="muted" id="count"></span></div><button id="undo" class="btn red hidden" onclick="undo()">↩️ Annulla ultimo</button></div>
<div class="filters" style="margin-top:12px"><input id="search" class="input search" placeholder="🔎 Cerca giocatore..." oninput="renderPlayers()"></div><div id="teamFilters" class="teamfilters"></div><div id="players" class="players"></div></div>
</main><aside><div class="glass card"><h2>👥 Squadre</h2><div id="users" class="users"></div></div><div class="glass card"><h2>📜 Cronologia</h2><div id="log" class="log"></div></div></aside></div></section></div><div id="toast" class="toast"></div>
<script>
const SESSION_KEY='fantacalcio-asta-session',ROLE_INFO={P:['🧤','Portieri'],D:['🛡️','Difensori'],C:['⚙️','Centrocampisti'],A:['⚽','Attaccanti']};const $=x=>document.getElementById(x);
function readSession(){try{const x=JSON.parse(localStorage.getItem(SESSION_KEY));return x?.roomCode&&x?.userId?x:null}catch{return null}}
function saveSession(x){try{localStorage.setItem(SESSION_KEY,JSON.stringify(x))}catch{}}
function newClientId(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`}
const s=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000,reconnectionDelayMax:5000});let S=null,serverOffset=0,session=readSession(),pending=null,me=session?.userId||null,teamFilter='ALL',th=null,requesting=false;
function clientId(){return session?.userId||pending?.userId||newClientId()}
function setRequesting(v){requesting=v;$('createRoom').disabled=v;$('joinRoom').disabled=v}
function send(event,payload){if(requesting)return;setRequesting(true);const emit=()=>s.emit(event,payload);if(s.connected)return emit();s.once('connect',emit);s.connect()}
function create(){const id=clientId();pending={userId:id};me=id;send('createRoom',{name:$('name').value,budget:Number($('budget').value)||500,clientId:id})}function join(){const id=clientId();pending={userId:id};me=id;send('joinRoom',{name:$('name').value,code:$('code').value,clientId:id})}
$('createRoom').addEventListener('click',create);$('joinRoom').addEventListener('click',join);
function exitRoom(){s.emit('leaveRoom');try{localStorage.removeItem(SESSION_KEY)}catch{}session=null;pending=null;me=null;S=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
$('leaveRoom').addEventListener('click',exitRoom);
function start(){s.emit('start')}function nextPhase(){s.emit('nextPhase')}function bid(n){s.emit('bid',{increment:n})}function undo(){s.emit('undoSale')}
$('nextPhase').addEventListener('click',nextPhase);
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
function restore(){if(session?.roomCode&&s.connected){me=session.userId;s.emit('rejoinRoom',{code:session.roomCode,clientId:session.userId})}}
s.on('connect',restore);s.on('connect_error',()=>{setRequesting(false);toast('Connessione al server non disponibile. Riprova.')});s.on('errorMessage',t=>{setRequesting(false);toast(t)});s.on('state',x=>{serverOffset=(x.serverNow||Date.now())-Date.now();S=x;setRequesting(false);if(me&&x.users.some(u=>u.id===me)){session={roomCode:x.code,userId:me};pending=null;saveSession(session)}$('login').classList.add('hidden');$('app').classList.remove('hidden');render()});
window.addEventListener('pageshow',()=>{if(s.connected)restore();else s.connect()});window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(s.connected)restore();else s.connect()}});
function render(){const us=S.users,my=us.find(u=>u.id===me),cur=us[S.turnIndex%Math.max(us.length,1)];$('room').textContent=`${S.code} · ${S.settings.budget} CREDITI`;$('phase').textContent=S.phaseDone?'ASTA COMPLETATA':`FASE: ${ROLE_INFO[S.phaseRole][1].toUpperCase()}`;
$('start').style.display=S.started?'none':'inline-block';$('nextPhase').classList.toggle('hidden',!(S.started&&!S.phaseDone&&!S.auction&&S.adminId===me));$('nextPhase').textContent=S.phaseRole==='A'?'✅ Termina asta':'➡️ Passa a '+ROLE_INFO[{P:'D',D:'C',C:'A'}[S.phaseRole]][1];$('undo').classList.toggle('hidden',!(S.adminId===me&&S.lastSale));$('turn').textContent=S.phaseDone?'Asta completata':S.started?(S.auction?`Asta proposta da ${byId(S.auction.proposerId)?.name||'—'}`:`Tocca a ${cur?.name||'—'} proporre`):`In attesa di ${S.settings.minPlayers} partecipanti`;
$('pname').textContent=S.auction?.player?.name||'Nessuna asta';$('offer').textContent=`${S.auction?.currentBid||0} crediti`; $('bidder').textContent=S.auction?.bidderName?`🏆 ${S.auction.bidderName}`:'Nessuna offerta';
document.querySelectorAll('.bid').forEach(b=>b.disabled=!S.auction||!my||my.team.length>=S.settings.maxPlayers||my.team.filter(p=>p.role===S.auction.player.role).length>=S.settings.squad[S.auction.player.role]);
$('users').innerHTML=us.map(u=>`<div class="user ${u.id===me?'me':''}"><div><b>${u.id===me?'👤 ':''}${esc(u.name)}</b> <span class="muted">${u.connected?'':'· offline'}</span>${roster(u)}</div><b>${u.budget}</b></div>`).join('');
$('log').innerHTML=S.log.slice().reverse().map(x=>`<div>${esc(x.text)}</div>`).join('');renderPlayers();timer()}
function byId(id){return S.users.find(x=>x.id===id)}
function roster(u){return Object.keys(ROLE_INFO).map(r=>{const [icon,label]=ROLE_INFO[r],players=u.team.filter(p=>p.role===r);return `<div class="roleblock"><div class="rolehead">${icon} ${label} ${players.length}/${S.settings.squad[r]}</div><div class="team">${players.map(p=>`<span class="mini">${esc(p.name)} · ${p.price}</span>`).join('')||'<span class="muted">—</span>'}</div></div>`}).join('')}
function teamIcon(team){return team.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function renderTeamFilters(){const teams=[...new Set(S.available.map(p=>p.team))].sort();if(teamFilter!=='ALL'&&!teams.includes(teamFilter))teamFilter='ALL';const filters=$('teamFilters');filters.innerHTML=`<button class="btn alt teamfilter ${teamFilter==='ALL'?'active':''}" type="button">Tutte</button>`+teams.map(team=>`<button class="btn alt teamfilter ${teamFilter===team?'active':''}" type="button"><span class="teamicon">${teamIcon(team)}</span>${esc(team)}</button>`).join('');filters.querySelectorAll('.teamfilter').forEach((button,index)=>button.addEventListener('click',()=>{teamFilter=index===0?'ALL':teams[index-1];renderPlayers()}))}
function renderPlayers(){const q=$('search').value.toLowerCase(),cur=S.users[S.turnIndex%Math.max(S.users.length,1)],my=S.users.find(u=>u.id===me),phase=S.phaseRole,can=S.started&&!S.phaseDone&&!S.auction&&cur?.id===me&&my&&my.team.length<S.settings.maxPlayers&&my.team.filter(p=>p.role===phase).length<S.settings.squad[phase];
renderTeamFilters();const arr=S.available.filter(p=>p.role===phase&&(teamFilter==='ALL'||p.team===teamFilter)&&p.name.toLowerCase().includes(q));$('count').textContent=`${arr.length} ${ROLE_INFO[phase][1].toLowerCase()} rimasti`;
const players=$('players');players.innerHTML=arr.map(p=>`<div class="player" style="cursor:${can?'pointer':'default'}"><strong>${esc(p.name)}</strong><small>${p.role} · ${esc(p.team)} · Qt.A: ${p.quotation}</small></div>`).join('');
if(can)players.querySelectorAll('.player').forEach((card,index)=>card.addEventListener('click',()=>propose(arr[index].name)))}
function propose(n){s.emit('propose',{playerName:n})}
function timer(){clearInterval(th);if(!S.auction){$('timer').textContent=S.settings.seconds;return}const tick=()=>{const x=Math.max(0,(S.auction.endsAt-(Date.now()+serverOffset))/1000);$('timer').textContent=Math.ceil(x);$('timer').classList.toggle('hot',x<=5);if(x<=0)clearInterval(th)};tick();th=setInterval(tick,100)}
function copyLink(){navigator.clipboard?.writeText(location.href).then(()=>toast('Link copiato'))}
function openDisplay(){window.open(location.href+'?display=1','_blank')}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
