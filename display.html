<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantacalcio TV</title><script src="/socket.io/socket.io.js"></script><style>body{margin:0;background:#050b14;color:#fff;font-family:system-ui;text-align:center}.box{padding:6vh 4vw}.small{color:#8da4bf;font-size:22px}.name{font-size:7vw;font-weight:1000;margin:2vh}.timer{font-size:13vw;font-weight:1000}.bid{font-size:4vw;font-weight:900}.winner{font-size:2vw;color:#9df1cb}</style></head><body><div class="box"><div class="small" id="turn">ASTA LIVE</div><div class="name" id="name">In attesa</div><div class="timer" id="timer">15</div><div class="bid" id="bid">0</div><div class="winner" id="winner"></div></div><script>const s=io(),$=x=>document.getElementById(x);s.on('state',x=>{let u=x.users[x.turnIndex%Math.max(x.users.length,1)];$('turn').textContent=x.auction?'OFFERTA IN CORSO':'TOCCA A '+(u?.name||'—');$('name').textContent=x.auction?.player?.name||'Pronto';$('bid').textContent=(x.auction?.currentBid||0)+' CREDITI'+(x.auction?.bidderName?' · '+x.auction.bidderName:'');if(x.auction){clearInterval(window.t);window.t=setInterval(()=>{$('timer').textContent=Math.max(0,Math.ceil((x.auction.endsAt-Date.now())/1000))},100)}else $('timer').textContent=x.settings.seconds});</script></body></html>
